[package]
name = "lanewise-desktop"
version = "0.1.0"
description = "The Lanewise Desktop App: the Tauri 2 shell, carrying the command API over Tauri IPC"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "lanewise_desktop"

[dependencies]
lanewise-commands = { version = "0.1.0", path = "../commands" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `unstable` for child webviews, which show Host pages in a Tab (ADR 0042).
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-http = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.14.0"

# The title bar kept in full screen (`src/full_screen.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }
