name: Release

# Runs on every push to main, which includes the merge of a pull request
# (ADR 0029). The pull request's checks (`ci.yml`) run again on the merged
# tree; then semantic-release reads the Conventional Commits since the last
# tag, decides the next version, puts it in package.json, writes CHANGELOG.md,
# tags it and makes a draft GitHub Release. The Desktop App is built from that
# tag for macOS and Windows, its update packages are signed by the Update key
# in a job of their own (ADR 0053), the installers go on the Release with the
# signed update packages and the `latest.json` the installed app updates
# from (ADR 0030), the notes say how to install them, and the Release is
# published. Last, the project website goes to GitHub Pages with the latest
# Release's downloads (ADR 0031).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release in flight, and never run two at once: a cancelled one
# could leave a tag with no installers.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  # Everything a pull request is checked with, on what was merged.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # semantic-release (`.releaserc.json`): `feat:` makes a minor version,
  # `fix:`, `perf:`, `refactor:`, `revert:` and `build:` a patch, a `!` or
  # `BREAKING CHANGE:` a major; `docs:`, `test:`, `chore:`, `ci:` and `style:`
  # none. Its commit is `[skip ci]`, so it doesn't start another run. The
  # Release it makes is a draft until `publish` has put the installers on it,
  # so the latest Release never lacks them. Only this repository releases: a
  # fork's main is verified and nothing more.
  release:
    needs: verify
    if: github.repository == 'adrianeyre/lanewise' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the tag, the version commit and the Release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    outputs:
      released: ${{ steps.made.outputs.released }}
      tag: ${{ steps.made.outputs.tag }}
      version: ${{ steps.made.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and its tags, to find the last release and the
          # commits since.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: before
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release

      # Whether it made a version: the newest tag on main, after it pushed. The
      # tag's package.json must have that version, since the Desktop App and
      # the footer both take theirs from it, and its CHANGELOG.md that
      # version's notes, since the footer's version opens it.
      - id: made
        env:
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          git fetch --quiet --tags origin main
          tag=$(git describe --tags --abbrev=0 --match 'v*' origin/main 2>/dev/null || true)
          if [ -n "$tag" ] && [ "$tag" != "$BEFORE" ]; then
            version=$(git show "$tag:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if [ "$version" != "${tag#v}" ]; then
              echo "::error title=Version mismatch::$tag's package.json says $version, so the footer wouldn't match the Release."
              exit 1
            fi
            if ! git show "$tag:CHANGELOG.md" | grep -Eq "^#{1,3} \[?${version//./\\.}\]?[ (]"; then
              echo "::error title=No changelog::$tag's CHANGELOG.md has no heading for $version, so the footer's Changelog wouldn't say what changed in it."
              exit 1
            fi
            { echo "released=true"; echo "tag=$tag"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=Released $tag::semantic-release made $tag; the Desktop App is built from it next."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::No commit since the last release calls for one (only docs, tests, chores or CI), so no version and no installers."
          fi

  # The Windows installer: `desktop/tauri.windows.conf.json` turns bundling on
  # for Windows, so `pnpm desktop:build` makes the release build and an NSIS
  # installer, and Tauri runs `app/scripts/release/signWindows.ts` on the app,
  # the installer and its uninstaller. That signs with a PFX when its secrets
  # are set (`docs/releases.md`, "Signing the installer") and leaves them unsigned
  # when they aren't, as they aren't until SignPath Foundation signs releases.
  windows:
    name: Windows installer
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tagged release: its package.json has the version semantic-release
          # just gave it, which Tauri names the installer with. In full, so a
          # branch of the same name is never built in its place: `sign`
          # checks the tag.
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # Fails here, before the build, on half a set of secrets. The secrets are
      # given to this step and the build only, not the whole job.
      - id: signing
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          how=$(node app/scripts/release/signWindows.ts --how)
          if [ "$how" = unsigned ]; then
            echo "signed=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice title=Windows installer not signed::No Windows signing secret is set, so the installer and the app in it are unsigned, and the release notes say how to get past SmartScreen."
          else
            echo "signed=signed" >> "$GITHUB_OUTPUT"
          fi

      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: pnpm install --frozen-lockfile

      # The NSIS installer is the update package too. The build never has the
      # Update key: `sign` signs the installer this job uploads (ADR 0053).
      - run: pnpm desktop:build
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Named for the release's version, so a build of any other fails here.
      - shell: bash
        env:
          INSTALLER: target/release/bundle/nsis/Lanewise_${{ needs.release.outputs.version }}_x64-setup.exe
        run: |
          mkdir upload
          cp "$INSTALLER" upload/
          ls -l upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanewise-windows
          path: upload/*
          if-no-files-found: error

  # The Mac app: `desktop/tauri.macos.conf.json` turns bundling on for macOS
  # and signs ad hoc, and `--target universal-apple-darwin` builds it for Apple
  # Silicon and Intel in one app, and a disk image of it. It is never
  # notarized: there is no Apple Developer account (PRD §12), and
  # `app/scripts/release/signMacos.ts` runs the build without any `APPLE_*`
  # variable Tauri would sign or notarize from.
  macos:
    name: macOS app (universal)
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP: target/universal-apple-darwin/release/bundle/macos/Lanewise.app
      DMG: target/universal-apple-darwin/release/bundle/dmg/Lanewise_${{ needs.release.outputs.version }}_universal.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # Both architectures, which Tauri builds one at a time and joins with lipo.
      - run: >-
          rustup toolchain install stable --profile minimal && rustup default stable &&
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: pnpm install --frozen-lockfile

      # The build never has the Update key (ADR 0053). Tauri makes the update
      # package, a `Lanewise.app.tar.gz` of the ad-hoc signed app, only when it
      # can sign it too, so once the app has a public key the build is given a
      # key made here and thrown away with the runner. Tauri only warns that it
      # isn't the app's. Its `.sig` is left behind, and `sign` signs the
      # package with the Update key.
      - id: throwaway
        name: Throwaway key
        run: |
          pubkey=$(node -p 'require("./desktop/tauri.conf.json").plugins.updater.pubkey')
          if [ -n "$pubkey" ]; then
            password=$(node -p 'require("node:crypto").randomBytes(24).toString("hex")')
            pnpm exec tauri signer generate --ci -p "$password" -w "$RUNNER_TEMP/throwaway.key" > /dev/null
            { echo "key=$RUNNER_TEMP/throwaway.key"; echo "password=$password"; } >> "$GITHUB_OUTPUT"
          fi

      - run: node app/scripts/release/signMacos.ts -- pnpm desktop:build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.throwaway.outputs.key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.throwaway.outputs.password }}

      # Asks what a Mac asks: the signature holds over the whole app; and that
      # it is ad hoc, universal and the release's version.
      - run: |
          codesign --verify --deep --strict --verbose=2 "$APP"
          node app/scripts/release/signMacos.ts --check "$APP"
          hdiutil verify "$DMG"

      # The disk image, not the app itself: an artifact is a zip, which would
      # lose the app's symlinks and executable bits. The update package, a
      # tarball that keeps them, goes to `sign` if there is one, named for the
      # version as the installers are, without the throwaway key's `.sig`.
      - env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir upload update
          cp "$DMG" upload/
          if [ -f "$APP.tar.gz" ]; then
            cp "$APP.tar.gz" "update/Lanewise_${VERSION}_universal.app.tar.gz"
          fi
          ls -l upload update

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanewise-macos
          path: upload/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-macos
          path: update/*
          if-no-files-found: ignore

  # The Update key signs the update packages here, and nowhere else
  # (ADR 0053). The build jobs run every Cargo build script, proc macro and
  # Vite plugin in the tree, and semantic-release runs some three hundred npm
  # packages, so none of them has the key. This job runs only GitHub's own
  # actions, Node and Lanewise's own scripts, which import only Node's
  # modules: nothing is installed. It runs in the `release` environment,
  # which holds the key's two secrets and which only `main` can use.
  #
  # First it checks, from the commit merged rather than from the tag, that the
  # tag the build jobs built is that commit and semantic-release's version
  # commit, and nothing more. Then it signs the NSIS installer and the Mac's
  # `.app.tar.gz` for the version, once it has checked the key is the one whose
  # public half the app is built with. With no key yet there is nothing to
  # sign; the public half committed without the private half fails, since no
  # installed copy would take this Release.
  sign:
    name: Update packages
    needs: [release, windows, macos]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit merged, and the tags, to check the tag against.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: The tag is what was merged
        run: node app/scripts/release/versionCommit.ts "$GITHUB_SHA" "$TAG" "$VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lanewise-windows
          path: update
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: update
          pattern: update-*
          merge-multiple: true

      - name: Update key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node app/scripts/release/updater.ts sign update "$VERSION"
          if ! ls update/*.sig > /dev/null 2>&1; then
            echo "::notice title=No update package::The updater has no key yet (docs/releases.md, \"The Update key\"), so this Release makes no update package and installed copies won't update to it."
          fi

      # The signatures, and the Mac's package they sign. The installer is
      # already on its way to `publish`.
      - run: |
          mkdir signed
          for sig in update/*.sig; do
            [ -f "$sig" ] || continue
            cp "$sig" signed/
            case "$sig" in *.app.tar.gz.sig) cp "${sig%.sig}" signed/ ;; esac
          done
          ls -l signed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lanewise-update
          path: signed/*
          if-no-files-found: ignore

  # The installers go on semantic-release's draft Release with the installing
  # section added to its notes (`app/scripts/release/releaseNotes.ts`), and
  # only then is it published. A pre-release (a version with a `-`) is never
  # made latest, so installed copies, which ask the latest Release for
  # `latest.json`, never update to one.
  publish:
    needs: [release, windows, macos, sign]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      WINDOWS: ${{ needs.windows.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: lanewise-*
          merge-multiple: true
      - run: ls -l release

      # `latest.json` (ADR 0030), with what's new from semantic-release's notes
      # before the installing section is added. It checks each update
      # package's signature against the committed public key and this version
      # first, as the installed app will, and fails on any it wouldn't take.
      # Before the Update key is made, there are none, and no latest.json.
      # The token goes only to the two steps that run `gh`.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          node app/scripts/release/updater.ts manifest release "https://github.com/adrianeyre/lanewise/releases/download/$TAG" notes.md
          if [ ! -f release/latest.json ]; then
            echo "::notice title=No latest.json::The updater has no key yet (docs/releases.md, \"The Update key\"), so installed copies won't update to this Release."
          fi
          node app/scripts/release/releaseNotes.ts notes.md "$VERSION" "$WINDOWS"

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" release/* --clobber
          latest=(--latest)
          case "$VERSION" in *-*) latest=(--prerelease --latest=false) ;; esac
          gh release edit "$TAG" --draft=false --title "Lanewise $VERSION" --notes-file notes.md "${latest[@]}"

  # Whether this repository's GitHub Pages is turned on and built by Actions
  # (Settings → Pages → Source: GitHub Actions, docs/releases.md's "The
  # project website"). Until it is, the website isn't deployed, and the run says so
  # and stays green.
  pages:
    if: github.repository == 'adrianeyre/lanewise' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      on: ${{ steps.pages.outputs.on }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api repos/adrianeyre/lanewise/pages --jq .build_type 2>/dev/null || true)
          if [ "$source" = workflow ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website not deployed::GitHub Pages isn't turned on with GitHub Actions as its source (Settings → Pages → Source: GitHub Actions), so the project website wasn't deployed."
          fi

  # The project website (`website/`), built with the latest Release's
  # installers for its download buttons and deployed with GitHub's Pages
  # actions. Only on a push to main, and only once everything before it has
  # passed: the checks, semantic-release, and the Release's publishing when
  # there was one, so the buttons offer the Release just made. The build runs
  # the website's npm packages, so its token can only read; `deploy` holds
  # the deployment's and runs only `deploy-pages` (ADR 0053).
  website:
    name: Project website
    needs: [verify, release, publish, pages]
    if: >-
      always() && needs.pages.outputs.on == 'true' &&
      needs.verify.result == 'success' && needs.release.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read # configure-pages reads the site's settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version commit semantic-release made, if it made one, so the
          # footer's version is the Release's.
          ref: ${{ needs.release.outputs.tag && format('refs/tags/{0}', needs.release.outputs.tag) || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # The footer's Credits list the crates the Desktop App bundles, from `cargo metadata`.
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: pnpm install --frozen-lockfile

      # The latest Release, never a draft or a pre-release, for the download
      # buttons. Before the first there is none, and the page says so.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$RUNNER_TEMP/latest-release.json"
          if gh api repos/adrianeyre/lanewise/releases/latest > "$release" 2>/dev/null; then
            echo "LANEWISE_LATEST_RELEASE=$release" >> "$GITHUB_ENV"
          else
            echo "::notice title=No Release yet::There is no published Release, so the website says there's nothing to download yet."
          fi

      - run: pnpm website:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy the project website
    needs: website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One deployment at a time, and never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # the deployment
      id-token: write # which deploy-pages proves it comes from this run with
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
