<?xml version="1.0" encoding="UTF-8"?>
<!--
  Lanewise's logo: a branch leaving a lane of commits, on a tile from indigo
  to teal. The icons beside this file are generated from it by
  `pnpm exec tauri icon desktop/icons/logo.svg -o <dir>`, keeping only the six
  `desktop/tauri.conf.json` and the Linux window use; the Mac app, its disk
  image and the Windows installer are drawn from them too. The website's and
  the app's favicons are drawn from it as `website/README.md` says.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <path d="M360 280 V744" fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round"/>
  <path d="M360 640 C360 520 664 560 664 420 V300" fill="none" stroke="#67e8f9" stroke-width="64" stroke-linecap="round"/>
  <circle cx="360" cy="276" r="76" fill="#ffffff"/>
  <circle cx="360" cy="748" r="76" fill="#ffffff"/>
  <circle cx="664" cy="296" r="76" fill="#67e8f9"/>
</svg>
