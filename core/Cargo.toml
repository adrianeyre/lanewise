[package]
name = "lanewise-core"
version = "0.1.0"
description = "The Git core: Git operations behind traits, a gix reader and a git CLI runner. UI-free"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gix = { version = "0.88.0", default-features = false, features = ["max-performance-safe", "sha1", "status"] }
notify = "8.2.0"
thiserror = "2.0.21"

# Signals git's process group on cancellation, so it stops cleanly.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
