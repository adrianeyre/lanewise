[package]
name = "spike-graph-canvas"
version = "0.0.0"
description = "Graph spike: a virtualized canvas in a Tauri webview, fed a window at a time over IPC"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.88.0", default-features = false, features = ["max-performance-safe", "sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spike-graph-layout = { path = "../layout" }
tauri = { version = "2.12.0", features = [] }

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

# Serve `ui/` from the binary, as a release build does, rather than from a
# dev server there isn't one of.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
