[package]
name = "spike-graph-layout"
version = "0.0.0"
description = "Graph spike: load a history with gix, order it and assign lanes two ways"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix = { version = "0.88.0", default-features = false, features = ["max-performance-safe", "sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
