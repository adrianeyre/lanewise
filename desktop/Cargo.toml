[package]
name = "lanewise-desktop"
version = "0.1.0"
description = "The Lanewise Desktop App: the Tauri 2 shell, carrying the command API over Tauri IPC"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "lanewise_desktop"

[dependencies]
lanewise-commands = { version = "0.1.0", path = "../commands" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `unstable` for child webviews, which show Host pages in a Tab (ADR 0042).
tauri = { version = "2.12.0", features = ["unstable"] }
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-http = "2.8.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-updater = "2.13.0"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dev-dependencies]
tauri = { version = "2.12.0", features = ["test"] }
